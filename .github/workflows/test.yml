# 송출 화면 테스트 — main 으로 가는 PR·푸시마다 단위 테스트·린트·타입 검사
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 단위 테스트 (Vitest)
        run: npm test

      - name: 린트
        run: npm run lint

      - name: 타입 검사
        run: npx tsc --noEmit

      # 저장소를 합치지 않는 대신(컨트롤 저장소 docs/adr-monorepo.md) 컨트롤 저장소와 같은 코드로 둔 파일이 어긋나면 실패
      - name: 컨트롤 저장소 main 받기 (공유 파일 비교용)
        uses: actions/checkout@v4
        with:
          repository: Broadcasting-System/ONAIR_CONTROL-CLIENT
          ref: main
          path: .shared-other

      - name: 공유 파일 복사본 검사
        run: node scripts/check-shared-copies.mjs --self display --other .shared-other
